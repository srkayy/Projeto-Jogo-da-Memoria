<!DOCTYPE html>
<html lang="pt-br">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória: Funções Orgânicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- Background decorativo -->
    <div class="bg-layer" aria-hidden="true">
        <div class="molecule mol-1"></div>
        <div class="molecule mol-2"></div>
        <div class="molecule mol-3"></div>
        <div class="molecule mol-4"></div>
        <div class="molecule mol-5"></div>
    </div>

    <!-- TELA INICIAL -->
    <div class="overlay intro-overlay" id="intro-overlay">
        <div class="glass-panel intro-content">
            <div class="intro-badge">⚗️ Química Orgânica</div>
            <h1 class="intro-title">Jogo da<br><span class="accent">Memória</span></h1>
            <p class="intro-desc">Associe os grupos funcionais aos nomes das funções orgânicas. Escolha seu nível de desafio:</p>
            <div class="difficulty-grid">
                <button class="diff-btn active" data-difficulty="easy">
                    <span class="diff-icon">🧪</span>
                    <span class="diff-label">Fácil</span>
                    <span class="diff-detail">8 pares · 3 min</span>
                </button>
                <button class="diff-btn" data-difficulty="medium">
                    <span class="diff-icon">🔬</span>
                    <span class="diff-label">Médio</span>
                    <span class="diff-detail">10 pares · 2 min</span>
                </button>
                <button class="diff-btn" data-difficulty="hard">
                    <span class="diff-icon">⚗️</span>
                    <span class="diff-label">Difícil</span>
                    <span class="diff-detail">12 pares · 90 seg</span>
                </button>
            </div>
            <button id="start-button" class="primary-btn">INICIAR EXPERIMENTO</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <span class="header-icon">⚗️</span>
                <div>
                    <h1>Funções Orgânicas</h1>
                    <p>Jogo da Memória</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-pill" id="timer-pill">
                    <span class="stat-icon">⏱</span>
                    <span id="timer-display">--:--</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-icon">🎯</span>
                    <span id="moves-count">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-icon">✅</span>
                    <span id="matches-count">0/0</span>
                </div>
            </div>
        </div>
        <div id="timer-bar-container"><div id="timer-bar"></div></div>
    </header>

    <!-- TABULEIRO -->
    <main class="game-container" id="game-board"></main>

    <!-- TELA DE RESULTADO -->
    <div class="overlay message-overlay" id="message-overlay" style="display:none;">
        <div class="glass-panel message-content">
            <div class="result-emoji" id="result-emoji">🎉</div>
            <h2 id="final-message">Parabéns!</h2>
            <p id="final-moves"></p>
            <div class="result-stats" id="result-stats"></div>
            <div class="result-actions">
                <button id="restart-button" class="primary-btn">JOGAR NOVAMENTE</button>
                <button id="change-diff-button" class="secondary-btn">TROCAR NÍVEL</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
